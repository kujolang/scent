[package]
name = "scent"
version = "1.1.0"
description = "Bounded local context packs with selection previews, provenance and redaction reporting."
license = "MIT"
repository = "https://github.com/kujolang/scent"

[kujo]
minimum_version = "1.3.1"
entry = "scent.kujo"
sources = ["."]
includes = ["README.md", "LICENSE", "VERSION", "CHANGELOG.md", "docs", "tests", "scripts"]
excludes = [".git", "out", "node_modules", "dist", "build"]

[dependencies]
